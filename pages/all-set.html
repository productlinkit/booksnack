<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2A5C">
  <title>You're all set · BookSnack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/onboarding.css">
</head>
<body>
  <div class="app">
    <main class="view onb" id="view-allset">
      <div class="shape-bg" aria-hidden="true"><i class="shape-l"></i><i class="shape-r"></i></div>
      <div class="onb-body center">
        <div class="art allset-art"><div class="float f-bounce"><img src="../assets/illustrations/cheer-check.png" alt="Happy reader cheering with a check mark"></div></div>
        <h1>You're<br><span class="hl">all set!</span></h1>
        <p class="onb-sub">Your personalized BookSnack feed is ready. Dive in and start exploring new ideas today.</p>
      </div>
      <div class="onb-foot"><button class="btn-primary" id="finishOnb">Start Reading</button></div>
    </main>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/all-set.js"></script>
</body>
</html>
