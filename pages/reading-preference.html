<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2A5C">
  <title>Reading Preferences · BookSnack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
  <div class="app">
    <main class="view full with-save">
    <header class="subbar"><a class="icon-btn" href="profile.html" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></a><h2>Reading Preferences</h2></header>
      <div class="pad stack">
        <div class="card">
          <div class="row"><div><b>Genres</b><small>Your favorite book categories</small></div><a class="edit" href="categories.html?edit=1">Edit</a></div>
          <div class="chips" id="genres"></div>
        </div>
        <div class="card">
          <div class="row"><div><b>Reading vibe</b><small>How you like to read</small></div><a class="edit" href="vibes.html?edit=1">Edit</a></div>
          <div class="chips" id="vibes"></div>
        </div>
        <div class="card">
          <b>Font &amp; Display</b><small>Customize your reading experience</small>
          <p class="lbl">Font Size</p>
          <input type="range" id="fontSize" min="14" max="26" value="18" aria-label="Font size">
          <div class="range-labels"><span>Small</span><span>Large</span></div>
          <p class="lbl small-g">Preview</p>
          <p class="preview">The quick brown fox jumps over the lazy dog.</p>
          <p class="lbl">Theme</p>
          <div class="themes" id="themes">
            <button class="theme light" data-theme="light"><b>Light</b><span>The quick brown fox...</span><i class="tick">✓</i></button>
            <button class="theme dark" data-theme="dark"><b>Dark</b><span>The quick brown fox...</span><i class="tick">✓</i></button>
            <button class="theme sepia" data-theme="sepia"><b>Sepia</b><span>The quick brown fox...</span><i class="tick">✓</i></button>
          </div>
          <p class="lbl">Spacing</p>
          <input type="range" id="spacing" min="1.2" max="2.2" step="0.1" value="1.6" aria-label="Line spacing">
        </div>
      </div>
    </main>
    <div class="save-wrap"><button class="btn-primary" id="saveBtn">Save Changes</button></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/reading-preference.js"></script>
</body>
</html>
