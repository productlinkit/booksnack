<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2A5C">
  <title>For You · BookSnack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body>
  <div class="app">
    <main class="view home">
      <header class="topbar">
        <a class="icon-btn soft" href="explore.html" aria-label="Browse categories"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></a>
        <div class="seg"><a href="home.html" class="active">For You</a><a href="library.html" class="">My Library</a></div>
        <a class="icon-btn soft" href="notifications.html" aria-label="Notifications" id="bell"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg></a>
      </header>
      <div class="card-stage" id="storyCard">
        <button class="fab fab-yellow tl" id="offlineBtn" aria-label="Download for offline"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg></button>
        <button class="fab fab-gray tc" id="fullBtn" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="fab fab-yellow tr" id="askBtn" aria-label="Ask AI about this book"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3Z"/></svg></button>
        <div class="feed" id="feed"></div>
        <button class="swipe-pill" id="swipeBtn">Swipe to Read <span class="chev" aria-hidden="true"><i>‹</i><i>‹</i><i>‹</i></span></button>
        <button class="fab fab-yellow br" id="audioBtn" aria-label="Listen"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4ZM16 9a4 4 0 0 1 0 6"/></svg></button>
        <div class="dots-wrap"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="action-bar">
          <button data-act="like" aria-label="Like"><svg viewBox="0 0 24 24" class="g"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z"/></svg><b>0</b></button>
          <button data-act="comment" aria-label="Comments"><svg viewBox="0 0 24 24" class="g"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"/></svg><b>0</b></button>
          <button data-act="share" aria-label="Share"><svg viewBox="0 0 24 24" class="g line"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg><b>0</b></button>
          <button data-act="save" aria-label="Save to library"><svg viewBox="0 0 24 24" class="g"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg><b>0</b></button>
        </div>
      </div>
    </main>
    <nav class="bottom-nav" data-nav="home"></nav>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/home.js"></script>
</body>
</html>
