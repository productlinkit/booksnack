<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2A5C">
  <title>Notification Settings · BookSnack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
  <div class="app">
    <main class="view">
    <header class="subbar"><a class="icon-btn" href="profile.html" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></a><h2>Notification Settings</h2></header>
      <div class="pad stack">
        <div class="set-list">
          <label class="set-row"><div class="grow"><b>Daily reading reminder</b><small>A nudge to read your daily snack</small></div><span class="switch"><input type="checkbox" data-ns="daily"><span></span></span></label>
          <label class="set-row" id="timeRow"><div class="grow"><b>Reminder time</b><small>When should we remind you?</small></div><input class="field" type="time" data-ns="time" style="width:auto;padding:8px 10px"></label>
        </div>
        <div class="set-list">
          <label class="set-row"><div class="grow"><b>Streak alerts</b><small>Don’t lose your reading streak</small></div><span class="switch"><input type="checkbox" data-ns="streak"><span></span></span></label>
          <label class="set-row"><div class="grow"><b>New summaries</b><small>When books in your genres are added</small></div><span class="switch"><input type="checkbox" data-ns="fresh"><span></span></span></label>
          <label class="set-row"><div class="grow"><b>Offers &amp; promotions</b><small>Discounts and special plans</small></div><span class="switch"><input type="checkbox" data-ns="promo"><span></span></span></label>
        </div>
      </div>
    </main>
    <nav class="bottom-nav" data-nav="profile"></nav>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/notification-settings.js"></script>
</body>
</html>
