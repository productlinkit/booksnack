<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F2A5C">
  <title>User Profile · BookSnack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
  <div class="app">
    <main class="view">
    <header class="subbar"><a class="icon-btn" href="profile.html" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></a><h2>User Profile</h2></header>
      <div class="pad">
        <div class="avatar big" id="avatar">P</div>
        <form class="form" id="profileForm">
          <label for="pName">Full name</label><input id="pName" autocomplete="name" required>
          <label for="pEmail">Email</label><input id="pEmail" type="email" autocomplete="email" required>
          <button class="btn-primary" style="margin-top:8px">Save changes</button>
        </form>
      </div>
    </main>
    <nav class="bottom-nav" data-nav="profile"></nav>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/edit-profile.js"></script>
</body>
</html>
